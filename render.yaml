# Render Blueprint — Cryptolytic
#
# This blueprint manages ONLY the Python technical-indicator microservice.
# The Go API (cryptolytic-api) and the React frontend (cryptolytic-frontend)
# are already deployed on Render and are intentionally NOT listed here, so
# applying this blueprint never touches them.
#
# After deploying, set INDICATOR_SERVICE_URL on the Go API service to this
# service's URL (https://python-indicators.onrender.com by default), then
# POST /api/indicators/calculate on the Go gateway starts working end-to-end.
services:
  - type: web
    name: python-indicators
    runtime: python
    rootDir: python-indicators
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
